<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18以內借位減法｜一步一步學</title><style>body{font-family:'Microsoft JhengHei',sans-serif;background:#f4f8ff;color:#172b4d;margin:0;text-align:center}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(26px,5vw,38px)}button{font:inherit;cursor:pointer;border:2px solid #3264aa;border-radius:16px;padding:12px 20px;background:white;font-size:23px;margin:5px;touch-action:manipulation}button:focus-visible{outline:4px solid orange}.primary{background:#2165c4;color:white}.question{font-size:clamp(35px,7vw,58px);font-weight:bold;margin:12px}.board{display:grid;grid-template-columns:1fr 1fr;max-width:400px;margin:12px auto;border:3px solid #222;background:white}.cell{border:1px solid #444;padding:8px;min-height:70px;font-size:clamp(35px,7vw,56px);font-weight:bold}.head{background:#dce4ee;min-height:auto;font-size:29px}.small{font-size:23px;color:#bb2929}.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:550px;margin:12px auto}.dot{height:30px;width:30px;border-radius:50%;background:#efb43c;border:2px solid #a87510}.ten{display:inline-flex;flex-wrap:wrap;gap:3px;width:90px;padding:7px;border:3px solid #2b83c5;border-radius:12px;background:#e5f3ff;justify-content:center}.ten .dot{width:20px;height:20px;background:#61a9eb;border-color:#3678af}.panel{background:white;border-radius:20px;padding:15px;margin:12px auto;box-shadow:0 2px 10px #ccd8e8}.instruction{font-size:clamp(22px,4vw,29px);font-weight:bold;min-height:65px}.choices{display:flex;flex-wrap:wrap;justify-content:center}.choices button{min-width:76px;background:#fce6f4}.hidden{display:none}.correct{color:#138343}.wrong{color:#c33}#feedback{font-size:25px;min-height:36px}#step{color:#385f99;font-size:19px}footer{font-size:15px;color:#65738b}</style></head><body><main><h1>🌟 18以內借位減法</h1><div id="step">第 1 步／4 步</div><div class="question" id="q"></div><div class="board"><div class="cell head">十位</div><div class="cell head">個位</div><div class="cell" id="tens"></div><div class="cell" id="ones"></div><div class="cell" id="subt"></div><div class="cell" id="subo"></div><div class="cell" id="restt">？</div><div class="cell" id="resto">？</div></div><div class="panel"><div class="instruction" id="instruction"></div><div id="visual" class="dots"></div><div id="choices" class="choices"></div><div id="feedback" aria-live="polite"></div><button id="next" class="primary hidden">下一步 ➜</button></div><button id="speak">🔊 再聽一次</button><button id="new">🔄 換一題</button><p id="score"></p><footer>依序完成：觀察借位 → 10 減下面的數 → 加上上面的個位數 → 完成答案</footer></main><script>let a,b,stage=0,done=0,prompt='',last='';const $=x=>document.getElementById(x);function say(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-TW';u.rate=.82;speechSynthesis.speak(u)}function dot(n,ten=false){return `<div class="${ten?'ten':'dots'}">${Array.from({length:n},()=>'<i class="dot"></i>').join('')}</div>`}function options(nums,answer){$('choices').innerHTML='';[...new Set(nums)].sort((x,y)=>x-y).forEach(n=>{let bt=document.createElement('button');bt.textContent=n;bt.onclick=()=>{if(n===answer){$('feedback').textContent='答對了！👏';$('feedback').className='correct';$('choices').innerHTML='';$('next').classList.remove('hidden');say('答對了！')}else{$('feedback').textContent='再試一次，看看提示。';$('feedback').className='wrong';say('再試一次')}};$('choices').append(bt)})}function draw(){let o=a%10,first=10-b; $('q').textContent=`${a} − ${b} =（　）`;$('step').textContent=`第 ${stage+1} 步／4 步`;$('tens').innerHTML=stage>=1?'<s style="color:#b55">1</s> → <span style="color:green">0</span>':'1';$('ones').innerHTML=stage>=1?`<span style="color:green">${o} + 10</span>`:o;$('subt').textContent='−';$('subo').textContent=b;$('restt').textContent=stage===3?'0':'？';$('resto').textContent=stage===3?a-b:'？';$('feedback').textContent='';$('next').classList.add('hidden');let msg='';if(stage===0){msg=`上面的個位 ${o} 不夠減下面的 ${b}，需要借 1 個十嗎？`;options(['要借位','不用借位'],'要借位');$('visual').innerHTML=`<div>${dot(o)}<p>上面個位有 ${o} 個，下面要減 ${b} 個</p></div>`}if(stage===1){msg=`先把借來的 10 個，減掉下面的 ${b} 個。10 減 ${b} 等於多少？`;options([first,Math.max(0,first-1),first+1],first);$('visual').innerHTML=`<div class="ten">${Array.from({length:10},(_,i)=>`<i class="dot" style="${i<b?'opacity:.25;text-decoration:line-through;background:#999':''}"></i>`).join('')}</div><p>10 個一，拿走 ${b} 個，剩下 ${first} 個</p>`}if(stage===2){msg=`再加上原本上面的個位 ${o}。${first} 加 ${o} 等於多少？`;options([first+o,Math.max(0,first+o-1),first+o+1],first+o);$('visual').innerHTML=`<div><strong>第一步剩下 ${first} 個</strong>${dot(first)}</div><div><strong>再加上原本的 ${o} 個</strong>${dot(o)}</div>`}if(stage===3){msg=`完成！${a} 減 ${b} 等於多少？`;options([a-b,Math.max(0,a-b-1),a-b+1],a-b);$('visual').innerHTML=`<div style="font-size:28px;font-weight:bold">10 − ${b} = ${first}<br>${first} + ${o} = ${a-b}</div>${dot(a-b)}`} $('instruction').textContent=msg;prompt=msg;say(msg)}function fresh(){let pairs=[];for(let x=11;x<=18;x++)for(let y=x%10+1;y<=9;y++)pairs.push([x,y]);let p=pairs[Math.floor(Math.random()*pairs.length)];if(p.join()==last&&pairs.length>1)p=pairs[(pairs.indexOf(p)+1)%pairs.length];[a,b]=p;last=p.join();stage=0;draw()}$('next').onclick=()=>{if(stage===3){done++;$('score').textContent=`已完成 ${done} 題！`;say('完成一題，真棒！');fresh()}else{stage++;draw()}};$('new').onclick=fresh;$('speak').onclick=()=>say(prompt);fresh();</script></body></html>
